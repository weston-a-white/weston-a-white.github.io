<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weston White</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #222;
        }

        .container {
            max-width: 480px;
            padding: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1rem;
            line-height: 1.7;
            color: #555;
            margin-bottom: 1.5rem;
        }

        ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        ul li a {
            text-decoration: none;
            color: #222;
            font-size: 0.95rem;
            border-bottom: 1px solid #ccc;
            padding-bottom: 2px;
            transition: border-color 0.2s, color 0.2s;
        }

        ul li a:hover {
            color: #000;
            border-color: #000;
        }

        ul li::before {
            content: "→ ";
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hey there! I'm Weston.</h1>
        <p>This website is currently a work in progress. In the meantime you can find my work at:</p>
        <ul>
            <li><a href="https://westonawhite7.wixsite.com/westonawhite" target="_blank">My current website</a></li>
            <li><a href="https://www.linkedin.com/in/westonawhite/" target="_blank">LinkedIn</a></li>
        </ul>
    </div>
</body>
</html>
